name: price-index
# Every day: record the price index in scripts/price-index.json if it changed (it moves only when a
# provider's price in the catalog does), so the website can show how it moves over time.
on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  snapshot:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - run: node --import tsx scripts/index-snapshot.ts
      - name: Publish changed index for review
        run: |
          git add scripts/price-index.json
          if git diff --cached --quiet; then exit 0; fi
          npm run -s site:data
          git add web/src/data/site.json
          bash scripts/publish-report.sh price-index "price-index: $(date -u +%F)"
