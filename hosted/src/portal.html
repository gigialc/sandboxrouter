<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sandboxrouter · dashboard</title>
<style>
  :root { --ink:#0b0d0c; --ink2:#3f4542; --muted:#6b726e; --line:#e4e7e5; --bg:#fff; --soft:#f6f7f6; --accent:#007f4f; --danger:#b42318; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.55 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif; color:var(--ink); background:var(--bg); }
  code, pre, .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size:13px; }
  a { color:inherit; }
  header { display:flex; align-items:center; justify-content:space-between; max-width:960px; margin:0 auto; padding:20px 24px; }
  .brand { font-weight:600; letter-spacing:-0.01em; text-decoration:none; }
  .brand span { color:var(--accent); }
  main { max-width:960px; margin:0 auto; padding:0 24px 64px; }
  h1 { font-size:28px; letter-spacing:-0.02em; margin:24px 0 4px; }
  h2 { font-size:15px; margin:0 0 12px; }
  .sub { color:var(--ink2); margin:0 0 24px; }
  .grid { display:grid; grid-template-columns: 1fr 1fr; gap:16px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  .card { border:1px solid var(--line); border-radius:10px; padding:20px; margin-bottom:16px; }
  .big { font-size:36px; font-weight:600; letter-spacing:-0.02em; font-variant-numeric: tabular-nums; }
  .muted { color:var(--muted); font-size:13px; }
  button, .btn { font:inherit; font-size:14px; border:1px solid var(--line); background:#fff; color:var(--ink); border-radius:7px; padding:6px 12px; cursor:pointer; text-decoration:none; display:inline-block; }
  button:hover, .btn:hover { border-color:#c9cecb; }
  button.primary, .btn.primary { background:var(--ink); color:#fff; border-color:var(--ink); }
  button.danger { color:var(--danger); }
  button:disabled { opacity:.5; cursor:default; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  input { font:inherit; font-size:14px; border:1px solid var(--line); border-radius:7px; padding:6px 10px; min-width:0; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { text-align:left; font-weight:500; color:var(--muted); font-size:12px; padding:6px 8px; border-bottom:1px solid var(--line); }
  td { padding:8px; border-bottom:1px solid var(--line); vertical-align:middle; font-variant-numeric: tabular-nums; }
  td.num, th.num { text-align:right; }
  .pill { display:inline-block; font-size:12px; padding:1px 8px; border-radius:99px; background:var(--soft); color:var(--ink2); }
  .pill.on { background:#e6f4ee; color:var(--accent); }
  .newkey { background:#e6f4ee; border:1px solid #bfe3d2; border-radius:8px; padding:12px; margin-top:12px; }
  .newkey code { word-break:break-all; }
  pre { background:var(--soft); border:1px solid var(--line); border-radius:8px; padding:14px; overflow:auto; margin:0; }
  .tabs { display:flex; gap:4px; margin-bottom:8px; }
  .tabs button { border:none; padding:4px 10px; color:var(--muted); }
  .tabs button.on { background:var(--soft); color:var(--ink); }
  .center { text-align:center; padding:72px 24px; }
  .note { background:var(--soft); border-radius:8px; padding:10px 12px; font-size:13px; color:var(--ink2); }
  .err { color:var(--danger); font-size:13px; }
  .empty { color:var(--muted); font-size:14px; padding:8px 0; }
</style>
</head>
<body>
<header>
  <a class="brand" href="https://sandboxrouter.vercel.app">sandbox<span>router</span></a>
  <div id="who" class="row"></div>
</header>
<main id="app"><p class="muted">Loading…</p></main>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[c]);
const usd = (n, d = 2) => (n < 0 ? "−$" : "$") + Math.abs(n).toFixed(n !== 0 && Math.abs(n) < 0.01 ? 6 : d);
const when = (t) => t ? new Date(t).toLocaleString(undefined, { month:"short", day:"numeric", hour:"2-digit", minute:"2-digit" }) : "";
const api = async (method, path, body) => {
  const r = await fetch(path, { method, headers: { "Content-Type":"application/json", "X-SR":"1" }, body: body && JSON.stringify(body) });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(data.error || r.statusText), { status: r.status });
  return data;
};
let state = null, newKey = null, tab = "ts";

function signedOut() {
  $("#who").innerHTML = "";
  $("#app").innerHTML = `
    <div class="center">
      <h1>One key for every sandbox provider</h1>
      <p class="sub">Prepaid credit, billed by the second at each provider's list price plus a small fee.<br>
      The router picks the cheapest tested provider and falls back when one is down.</p>
      <a class="btn primary" href="/auth/github">Sign in with GitHub</a>
    </div>`;
}

function render() {
  const s = state;
  $("#who").innerHTML = `<span class="muted">${esc(s.login)}</span><button id="logout">Sign out</button>`;
  $("#logout").onclick = async () => { await api("POST", "/account/logout"); location.href = "/dashboard"; };
  const running = s.sandboxes.filter((x) => !x.endedAt);
  const l = s.limits;
  const done = new URLSearchParams(location.search).get("topup") === "done";

  $("#app").innerHTML = `
    <h1>Dashboard</h1>
    <p class="sub">List price + ${l.feePct}%, billed by the second. Up to ${l.maxConcurrent} sandboxes at once, ${l.maxLifetimeMinutes / 60} h each, ${l.maxVcpu} vCPU / ${l.maxMemoryGb} GB max.</p>
    ${s.blocked ? `<div class="card err">This account is blocked. Write to ${esc(s.contact)}.</div>` : ""}
    <div class="grid">
      <section class="card">
        <h2>Credit</h2>
        <div class="big">${usd(s.balanceUsd)}</div>
        ${done ? `<p class="muted">Payment received. Credit shows up here within a minute; refresh if it hasn't.</p>` : ""}
        ${s.topups.length ? `
          <p class="muted" style="margin:12px 0 8px">Add credit</p>
          <div class="row">${s.topups.map((u) => `<button data-topup="${u}">$${u}</button>`).join("")}</div>
          <p id="topup-err" class="err"></p>` :
          `<p class="note" style="margin-top:12px">Card payments aren't set up on this server yet.</p>`}
      </section>
      <section class="card">
        <h2>API keys</h2>
        ${s.keys.length ? `<table>${s.keys.map((k) => `
          <tr><td class="mono">${esc(k.prefix)}…</td><td>${esc(k.name)}</td>
          <td class="muted">${k.last_used_at ? "used " + when(k.last_used_at) : "never used"}</td>
          <td class="num"><button class="danger" data-revoke="${esc(k.id)}">Revoke</button></td></tr>`).join("")}</table>`
          : `<p class="empty">No keys yet.</p>`}
        <form id="mk" class="row" style="margin-top:12px">
          <input id="kname" placeholder="Name (optional)" maxlength="60">
          <button class="primary">Create key</button>
        </form>
        ${newKey ? `<div class="newkey"><div class="muted">Copy it now; it won't be shown again.</div>
          <div class="row" style="margin-top:6px"><code id="nk">${esc(newKey)}</code><button id="copy">Copy</button></div></div>` : ""}
      </section>
    </div>

    <section class="card">
      <h2>Quickstart</h2>
      <div class="tabs">${["ts","python","curl"].map((t) => `<button data-tab="${t}" class="${t === tab ? "on" : ""}">${{ ts:"TypeScript", python:"Python", curl:"curl" }[t]}</button>`).join("")}</div>
      <pre>${esc(snippet(tab, s.apiUrl))}</pre>
    </section>

    <section class="card">
      <h2>Sandboxes ${running.length ? `<span class="pill on">${running.length} running</span>` : ""}</h2>
      ${s.sandboxes.length ? `<table>
        <tr><th>Sandbox</th><th>Provider</th><th class="num">Per hour</th><th>Started</th><th>Status</th><th class="num">Cost</th><th></th></tr>
        ${s.sandboxes.map((x) => `<tr>
          <td class="mono">${esc(x.id.split(":").slice(1).join(":").slice(0, 18))}</td>
          <td>${esc(x.provider)}</td>
          <td class="num">${usd(x.hourlyUsd, 3)}</td>
          <td class="muted">${when(x.startedAt)}</td>
          <td>${x.endedAt ? `<span class="pill">${esc(x.endReason)}</span>` : `<span class="pill on">running</span>`}</td>
          <td class="num">${usd(x.costUsd, 4)}</td>
          <td class="num">${x.endedAt ? "" : `<button class="danger" data-kill="${esc(x.id)}">Kill</button>`}</td>
        </tr>`).join("")}</table>` : `<p class="empty">None yet. Create a key and run the quickstart.</p>`}
    </section>

    <section class="card">
      <h2>Credit history</h2>
      ${s.ledger.length ? `<table>${s.ledger.map((e) => `<tr><td class="muted">${when(e.createdAt)}</td><td>${esc(e.note || e.kind)}</td><td class="num">${usd(e.amountUsd)}</td></tr>`).join("")}</table>`
        : `<p class="empty">No credit added yet.</p>`}
    </section>
    <p class="muted">Usage is charged per sandbox; the table above shows each one's cost so far. Questions or abuse reports: ${esc(s.contact)}.</p>`;

  document.querySelectorAll("[data-topup]").forEach((b) => b.onclick = async () => {
    b.disabled = true;
    try { location.href = (await api("POST", "/account/topup", { usd: Number(b.dataset.topup) })).url; }
    catch (e) { $("#topup-err").textContent = e.message; b.disabled = false; }
  });
  document.querySelectorAll("[data-revoke]").forEach((b) => b.onclick = async () => { b.disabled = true; await api("DELETE", "/account/keys/" + b.dataset.revoke); newKey = null; load(); });
  document.querySelectorAll("[data-kill]").forEach((b) => b.onclick = async () => { b.disabled = true; await api("DELETE", "/account/sandboxes/" + encodeURIComponent(b.dataset.kill)); load(); });
  document.querySelectorAll("[data-tab]").forEach((b) => b.onclick = () => { tab = b.dataset.tab; render(); });
  $("#mk").onsubmit = async (e) => { e.preventDefault(); newKey = (await api("POST", "/account/keys", { name: $("#kname").value })).key; load(); };
  if ($("#copy")) $("#copy").onclick = () => { navigator.clipboard.writeText(newKey); $("#copy").textContent = "Copied"; };
}

function snippet(t, url) {
  if (t === "ts") return `npm i @sandboxrouter/sdk

import { Client } from "@sandboxrouter/sdk";

const sr = new Client({ baseUrl: "${url}", apiKey: process.env.SANDBOXROUTER_API_KEY });
const sbx = await sr.create({ vcpu: 2, memoryGb: 4 });
console.log(sbx.provider, (await sbx.exec("python3 -c 'print(6*7)'")).stdout);
await sbx.kill();`;
  if (t === "python") return `pip install "git+https://github.com/gigialc/sandboxrouter#subdirectory=python"

import os
from sandboxrouter import Client

sr = Client("${url}", token=os.environ["SANDBOXROUTER_API_KEY"])
with sr.create(vcpu=2, memory_gb=4) as sbx:
    print(sbx.provider, sbx.exec("python3 -c 'print(6*7)'").stdout)`;
  return `curl -s ${url}/v1/sandboxes -H "Authorization: Bearer $SANDBOXROUTER_API_KEY" \\
  -H "Content-Type: application/json" -d '{"vcpu":2,"memoryGb":4}'
# → {"id":"maritime:…","provider":"maritime",…}

curl -s ${url}/v1/sandboxes/ID/exec -H "Authorization: Bearer $SANDBOXROUTER_API_KEY" \\
  -H "Content-Type: application/json" -d '{"cmd":"echo hi"}'

curl -s -X DELETE ${url}/v1/sandboxes/ID -H "Authorization: Bearer $SANDBOXROUTER_API_KEY"`;
}

async function load() {
  try { state = await api("GET", "/account/me"); render(); }
  catch (e) { if (e.status === 401) signedOut(); else $("#app").innerHTML = `<p class="err">${esc(e.message)}</p>`; }
}
load();
</script>
</body>
</html>
